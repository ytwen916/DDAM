MODEL:
  PRETRAIN_PATH: 'vit_base_ics_cfs_lup.pth'
  PRETRAIN_HW_RATIO: 2
  IF_LABELSMOOTH: 'off'
  IF_WITH_CENTER: 'no'
  NAME: 'transformer'
  NO_MARGIN: True
  DEVICE_ID: ('0')
  TRANSFORMER_TYPE: 'vit_base_patch16_224_TransReID'
  STRIDE_SIZE: [16, 16]
  STEM_CONV: True
  TRIPLET_LOSS_WEIGHT: 1.5  #damptriplet
  METRIC_LOSS_TYPE: 'damptriplet'  # damptriplet, triplet, rris, instruct,....
  APS: 3 #max limit to 3
  ANS: 1



INPUT:
  SIZE_TRAIN: [256, 128]
  SIZE_TEST: [256, 128]
  PROB: 0.5 # random horizontal flip
  RE_PROB: 0.5 # random erasing
  PADDING: 10
  PIXEL_MEAN: [0.3958, 0.3729, 0.3715]
  PIXEL_STD: [0.1305, 0.1203, 0.1146]

DATASETS:
  NAMES: ('nightreid')
  ROOT_DIR: ('/media/lenovo/8fff525d-1701-4726-b55f-3d59430b9e6f/zjy/NightReID-zjy/data')

DATALOADER:
  SAMPLER: 'softmax_triplet'
  NUM_INSTANCE: 4
  NUM_WORKERS: 8

SOLVER:
  OPTIMIZER_NAME: 'SGD'
  MAX_EPOCHS: 120
  BASE_LR: 0.0004
  WARMUP_EPOCHS: 20
  IMS_PER_BATCH: 64 #64
  WARMUP_METHOD: 'cosine'
  LARGE_FC_LR: False
  CHECKPOINT_PERIOD: 10
  LOG_PERIOD: 50
  EVAL_PERIOD: 10
  WEIGHT_DECAY:  1e-4
  WEIGHT_DECAY_BIAS: 1e-4
  BIAS_LR_FACTOR: 2

TEST:
  EVAL: True
  IMS_PER_BATCH: 64   #64
  RE_RANKING: False
  WEIGHT: './0628/Interaction Layer/6-11/nightreid/528wD/transformer_best_mAP.pth'
  NECK_FEAT: 'before'
  FEAT_NORM: 'yes'


OUTPUT_DIR: './temp/0817/nightreid/528wD'


